name: Android checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Check bundled model identity
        run: python3 tools/verify_model_pack.py
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Test and build
        run: ./gradlew --no-daemon :tide-core:test :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug :app:bundleRelease
