name: Publish privacy page
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Render public privacy policy
        run: python3 tools/render_privacy.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/site
      - id: deployment
        uses: actions/deploy-pages@v4
